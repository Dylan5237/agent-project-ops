<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">agent-project-ops 运行原理</title><desc id="desc">权威、投射、失败即关闭和可复验交付模型。</desc>
  <defs><style>.s{font-family:Inter,Segoe UI,Arial,"Noto Sans SC",sans-serif}.h{font-weight:800;fill:#0d2b59}.m{fill:#526984}.card{stroke-width:2}.t{font-size:29px;font-weight:750}.p{font-size:23px}.tag{font-size:21px;font-weight:700}</style><filter id="sh"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-opacity=".08"/></filter></defs>
  <rect width="1600" height="980" rx="34" fill="#fbfdff"/>
  <g class="s">
    <text x="74" y="96" font-size="62" class="h">agent-project-ops 运行原理</text><text x="74" y="146" font-size="27" class="m">规则留在仓库，关键约束由服务端执行，最终用可复验证据完成验收。</text>
    <g transform="translate(66 218)">
      <g filter="url(#sh)"><rect width="340" height="530" rx="28" fill="#edf6ff" stroke="#9ecbfa" class="card"/></g><circle cx="62" cy="64" r="34" fill="#1775e5"/><text x="51" y="75" fill="white" font-size="32" font-weight="800">1</text><text x="116" y="72" class="t" fill="#164b88">权威</text><text x="30" y="132" class="p" font-weight="700" fill="#143762">GitHub = 唯一写权威</text><text x="30" y="174" class="p m">已接受的变更必须通过 PR。</text><text x="30" y="212" class="p m">本地 checkout 只是草稿和工作区。</text><rect x="30" y="260" width="280" height="112" rx="18" fill="#fff" stroke="#cfe2f8"/><text x="52" y="302" class="tag" fill="#164b88">禁止日常直推 main</text><text x="52" y="340" class="p m">默认分支交给保护规则。</text><rect x="30" y="396" width="280" height="100" rx="18" fill="#fff" stroke="#cfe2f8"/><text x="52" y="438" class="tag" fill="#164b88">一个任务 = 一个 PR</text><text x="52" y="474" class="p m">工作始终可追踪。</text>
      <g transform="translate(380 0)" filter="url(#sh)"><rect width="340" height="530" rx="28" fill="#edfbf5" stroke="#9cdec4" class="card"/></g><circle cx="442" cy="64" r="34" fill="#0ca56f"/><text x="431" y="75" fill="white" font-size="32" font-weight="800">2</text><text x="496" y="72" class="t" fill="#117451">投射</text><text x="410" y="132" class="p" font-weight="700" fill="#174e3a">GitLab / 镜像只能是投射。</text><text x="410" y="174" class="p m">可以有第二远端，</text><text x="410" y="212" class="p m">不能有第二写权威。</text><rect x="410" y="260" width="280" height="112" rx="18" fill="#fff" stroke="#caeadc"/><text x="432" y="302" class="tag" fill="#117451">只跟随权威 tip</text><text x="432" y="340" class="p m">投射只能跟随 GitHub。</text><rect x="410" y="396" width="280" height="100" rx="18" fill="#fff" stroke="#caeadc"/><text x="432" y="438" class="tag" fill="#117451">绝不成为第二控制面</text><text x="432" y="474" class="p m">不能演化成第二 SoT。</text>
      <g transform="translate(760 0)" filter="url(#sh)"><rect width="340" height="530" rx="28" fill="#fff8e8" stroke="#ebcb79" class="card"/></g><circle cx="822" cy="64" r="34" fill="#e9a11b"/><text x="811" y="75" fill="white" font-size="32" font-weight="800">3</text><text x="876" y="72" class="t" fill="#8f6104">失败即关闭</text><text x="790" y="132" class="p" font-weight="700" fill="#644805">未知远端默认阻塞。</text><text x="790" y="174" class="p m">能力缺口不能靠文字放宽。</text><rect x="790" y="260" width="280" height="112" rx="18" fill="#fff" stroke="#eedfb8"/><text x="812" y="302" class="tag" fill="#8f6104">能力等级 A / B / C</text><text x="812" y="340" class="p m">如实报告真实环境。</text><rect x="790" y="396" width="280" height="100" rx="18" fill="#fff" stroke="#eedfb8"/><text x="812" y="438" class="tag" fill="#8f6104">服务端 &gt; hook &gt; 文档</text><text x="812" y="474" class="p m">服务端才是硬门槛。</text>
      <g transform="translate(1140 0)" filter="url(#sh)"><rect width="340" height="530" rx="28" fill="#fff0f3" stroke="#efb5be" class="card"/></g><circle cx="1202" cy="64" r="34" fill="#d74f61"/><text x="1191" y="75" fill="white" font-size="32" font-weight="800">4</text><text x="1256" y="72" class="t" fill="#a23b4a">验证</text><text x="1170" y="132" class="p" font-weight="700" fill="#6b3340">合并不等于阶段通过。</text><text x="1170" y="174" class="p m">证据必须可复验。</text><rect x="1170" y="260" width="280" height="112" rx="18" fill="#fff" stroke="#efd2d7"/><text x="1192" y="302" class="tag" fill="#a23b4a">证据已就绪</text><text x="1192" y="340" class="p m">Agent 提交证明。</text><rect x="1170" y="396" width="280" height="100" rx="18" fill="#fff" stroke="#efd2d7"/><text x="1192" y="438" class="tag" fill="#a23b4a">Disposer 拍板</text><text x="1192" y="474" class="p m">接受 / 退回</text>
    </g>
    <g transform="translate(74 810)"><text x="0" y="0" font-size="28" font-weight="800" fill="#0d2b59">关键规则</text><g transform="translate(0 34)"><rect width="270" height="82" rx="18" fill="#f4f7fb"/><text x="24" y="50" class="tag" fill="#17365f">聊天 ≠ 状态</text><rect x="294" width="310" height="82" rx="18" fill="#f4f7fb"/><text x="318" y="50" class="tag" fill="#17365f">一个任务 = 一个 worktree/PR</text><rect x="628" width="272" height="82" rx="18" fill="#f4f7fb"/><text x="652" y="50" class="tag" fill="#17365f">禁止直推 main</text><rect x="924" width="272" height="82" rx="18" fill="#f4f7fb"/><text x="948" y="50" class="tag" fill="#17365f">客户端 hook 可绕过</text><rect x="1220" width="292" height="82" rx="18" fill="#f4f7fb"/><text x="1244" y="50" class="tag" fill="#17365f">服务端保护才是真门槛</text></g></g>
  </g>
</svg>
