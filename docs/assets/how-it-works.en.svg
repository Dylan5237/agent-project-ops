<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">How agent-project-ops works</title><desc id="desc">Authority, projection, fail-closed enforcement, and verification model.</desc>
  <defs><style>.s{font-family:Inter,Segoe UI,Arial,sans-serif}.h{font-weight:800;fill:#0d2b59}.m{fill:#526984}.card{stroke-width:2}.t{font-size:29px;font-weight:750}.p{font-size:23px}.tag{font-size:21px;font-weight:700}</style><filter id="sh"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-opacity=".08"/></filter></defs>
  <rect width="1600" height="980" rx="34" fill="#fbfdff"/>
  <g class="s">
    <text x="74" y="96" font-size="62" class="h">How agent-project-ops works</text><text x="74" y="146" font-size="27" class="m">Durable rules in the repo. Real enforcement at the server. Replayable verification by evidence.</text>
    <g transform="translate(66 218)">
      <g filter="url(#sh)"><rect width="340" height="530" rx="28" fill="#edf6ff" stroke="#9ecbfa" class="card"/></g><circle cx="62" cy="64" r="34" fill="#1775e5"/><text x="51" y="75" fill="white" font-size="32" font-weight="800">1</text><text x="116" y="72" class="t" fill="#164b88">Authority</text><text x="30" y="132" class="p" font-weight="700" fill="#143762">GitHub = Single Source of Truth</text><text x="30" y="174" class="p m">All accepted changes flow through PRs.</text><text x="30" y="212" class="p m">Local checkout = draft/workspace.</text><rect x="30" y="260" width="280" height="112" rx="18" fill="#fff" stroke="#cfe2f8"/><text x="52" y="302" class="tag" fill="#164b88">No routine direct main push</text><text x="52" y="340" class="p m">Default branch is protected.</text><rect x="30" y="396" width="280" height="100" rx="18" fill="#fff" stroke="#cfe2f8"/><text x="52" y="438" class="tag" fill="#164b88">One task = one PR</text><text x="52" y="474" class="p m">Work stays traceable.</text>
      <g transform="translate(380 0)" filter="url(#sh)"><rect width="340" height="530" rx="28" fill="#edfbf5" stroke="#9cdec4" class="card"/></g><circle cx="442" cy="64" r="34" fill="#0ca56f"/><text x="431" y="75" fill="white" font-size="32" font-weight="800">2</text><text x="496" y="72" class="t" fill="#117451">Projection</text><text x="410" y="132" class="p" font-weight="700" fill="#174e3a">GitLab / mirrors are projections.</text><text x="410" y="174" class="p m">A second remote is allowed.</text><text x="410" y="212" class="p m">A second authority is not.</text><rect x="410" y="260" width="280" height="112" rx="18" fill="#fff" stroke="#caeadc"/><text x="432" y="302" class="tag" fill="#117451">Follow authority tip</text><text x="432" y="340" class="p m">Projection follows GitHub.</text><rect x="410" y="396" width="280" height="100" rx="18" fill="#fff" stroke="#caeadc"/><text x="432" y="438" class="tag" fill="#117451">Never become SoT</text><text x="432" y="474" class="p m">No second control plane.</text>
      <g transform="translate(760 0)" filter="url(#sh)"><rect width="340" height="530" rx="28" fill="#fff8e8" stroke="#ebcb79" class="card"/></g><circle cx="822" cy="64" r="34" fill="#e9a11b"/><text x="811" y="75" fill="white" font-size="32" font-weight="800">3</text><text x="876" y="72" class="t" fill="#8f6104">Fail closed</text><text x="790" y="132" class="p" font-weight="700" fill="#644805">Unknown remotes are blocked.</text><text x="790" y="174" class="p m">Capability gaps are not waived.</text><rect x="790" y="260" width="280" height="112" rx="18" fill="#fff" stroke="#eedfb8"/><text x="812" y="302" class="tag" fill="#8f6104">Capability A / B / C</text><text x="812" y="340" class="p m">Report the real environment.</text><rect x="790" y="396" width="280" height="100" rx="18" fill="#fff" stroke="#eedfb8"/><text x="812" y="438" class="tag" fill="#8f6104">Server &gt; hook &gt; docs</text><text x="812" y="474" class="p m">The server is the hard gate.</text>
      <g transform="translate(1140 0)" filter="url(#sh)"><rect width="340" height="530" rx="28" fill="#fff0f3" stroke="#efb5be" class="card"/></g><circle cx="1202" cy="64" r="34" fill="#d74f61"/><text x="1191" y="75" fill="white" font-size="32" font-weight="800">4</text><text x="1256" y="72" class="t" fill="#a23b4a">Verification</text><text x="1170" y="132" class="p" font-weight="700" fill="#6b3340">Merge is not Phase PASS.</text><text x="1170" y="174" class="p m">Evidence must be replayable.</text><rect x="1170" y="260" width="280" height="112" rx="18" fill="#fff" stroke="#efd2d7"/><text x="1192" y="302" class="tag" fill="#a23b4a">EVIDENCE READY</text><text x="1192" y="340" class="p m">Agent proposes proof.</text><rect x="1170" y="396" width="280" height="100" rx="18" fill="#fff" stroke="#efd2d7"/><text x="1192" y="438" class="tag" fill="#a23b4a">Disposer decides</text><text x="1192" y="474" class="p m">ACCEPT / RETURN</text>
    </g>
    <g transform="translate(74 810)"><text x="0" y="0" font-size="28" font-weight="800" fill="#0d2b59">Key rules</text><g transform="translate(0 34)"><rect width="270" height="82" rx="18" fill="#f4f7fb"/><text x="24" y="50" class="tag" fill="#17365f">Chat ≠ state</text><rect x="294" width="310" height="82" rx="18" fill="#f4f7fb"/><text x="318" y="50" class="tag" fill="#17365f">One task = one worktree/PR</text><rect x="628" width="272" height="82" rx="18" fill="#f4f7fb"/><text x="652" y="50" class="tag" fill="#17365f">No direct main push</text><rect x="924" width="272" height="82" rx="18" fill="#f4f7fb"/><text x="948" y="50" class="tag" fill="#17365f">Client hook is bypassable</text><rect x="1220" width="292" height="82" rx="18" fill="#f4f7fb"/><text x="1244" y="50" class="tag" fill="#17365f">Server protection is the gate</text></g></g>
  </g>
</svg>
