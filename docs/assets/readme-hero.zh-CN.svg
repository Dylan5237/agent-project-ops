<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">agent-project-ops 全景</title>
  <desc id="desc">以技能为入口的多智能体项目治理方法，包含四个已验证关卡与明确的权威规则。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#123" flood-opacity=".08"/></filter>
    <style>.sans{font-family:Inter,Segoe UI,Arial,"Noto Sans SC",sans-serif}.title{font-weight:800;fill:#0d2b59}.muted{fill:#506784}.small{font-size:24px}.gate{font-size:28px;font-weight:700}.pass{font-size:24px;font-weight:800;fill:#087f5b}.rule{font-size:25px;font-weight:700;fill:#17365f}</style>
  </defs>
  <rect width="1600" height="820" rx="34" fill="url(#bg)"/>
  <g class="sans">
    <text x="76" y="112" font-size="78" class="title">agent-project-ops</text>
    <text x="76" y="170" font-size="36" font-weight="650" fill="#38527b">以技能为入口的多智能体项目治理</text>
    <text x="76" y="224" font-size="28" class="muted">让 AI Agent 在真实项目中安全、可控、可验证地长期协作。</text>
    <g transform="translate(1190 58)" filter="url(#shadow)"><rect width="330" height="126" rx="28" fill="#0bb27b"/><text x="34" y="53" fill="white" font-size="34" font-weight="800">v0.1</text><text x="34" y="91" fill="white" font-size="23" font-weight="650">可用于真实受控项目</text></g>
    <g transform="translate(72 304)">
      <g filter="url(#shadow)"><rect width="330" height="210" rx="26" fill="#edf6ff" stroke="#a8d2ff"/></g><text x="30" y="52" class="gate" fill="#1769c2">G1 · 项目初始化</text><text x="30" y="98" class="small muted">初始化与持久绑定</text><text x="30" y="146" class="pass">✓ 通过</text><text x="30" y="184" class="small muted">PR #8</text>
      <g transform="translate(376 0)" filter="url(#shadow)"><rect width="330" height="210" rx="26" fill="#ecfbf5" stroke="#9de2c7"/></g><text x="406" y="52" class="gate" fill="#0a8a61">G2 · 真实仓库验证</text><text x="406" y="98" class="small muted">GitHub 仓库、PIN 与远端登记</text><text x="406" y="146" class="pass">✓ 通过</text><text x="406" y="184" class="small muted">私有仓库 + Windows</text>
      <g transform="translate(752 0)" filter="url(#shadow)"><rect width="330" height="210" rx="26" fill="#fff8e8" stroke="#f2cf79"/></g><text x="782" y="52" class="gate" fill="#9a6500">G3 · 服务端保护</text><text x="782" y="98" class="small muted">PR 门禁与能力等级 A/B/C</text><text x="782" y="146" class="pass">✓ 通过</text><text x="782" y="184" class="small muted">绕过 hook 仍被 GitHub 拒绝</text>
      <g transform="translate(1128 0)" filter="url(#shadow)"><rect width="330" height="210" rx="26" fill="#fff0f2" stroke="#f3b3bc"/></g><text x="1158" y="52" class="gate" fill="#b33a4c">G4 · 自我验证</text><text x="1158" y="98" class="small muted">方法论仓库完整生命周期</text><text x="1158" y="146" class="pass">✓ 通过</text><text x="1158" y="184" class="small muted">Phase #11 已验收</text>
    </g>
    <g transform="translate(74 592)"><rect width="1450" height="150" rx="28" fill="#f4f7fb" stroke="#dbe6f3"/><text x="34" y="52" class="rule">GitHub = 唯一写权威</text><text x="400" y="52" class="rule">投射远端 ≠ 第二权威</text><text x="802" y="52" class="rule">未知远端 → 默认拒绝</text><text x="1176" y="52" class="rule">合并 ≠ 阶段通过</text><text x="34" y="102" class="small muted">聊天 ≠ 状态 · 一个任务 = 一个 worktree/branch/PR · Agent 提议 · Disposer 拍板</text></g>
  </g>
</svg>
