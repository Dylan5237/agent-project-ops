<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">删掉所有聊天后的接管测试</title>
  <desc id="desc">原始会话被删除后，一个全新 Agent 仅凭仓库持久状态恢复权威、规则和当前阶段，继续工作并通过接管测试。</desc>
  <defs>
    <style>
      .s{font-family:Inter,Segoe UI,Arial,"Noto Sans SC",sans-serif}
      .h{font-weight:800;fill:#0d2b59}
      .m{fill:#506784}
      .tag{font-weight:700}
      .step{font-size:23px;fill:#174e3a;font-weight:600}
    </style>
    <marker id="ag" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0ca56f"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-opacity=".08"/></filter>
  </defs>
  <rect width="1600" height="940" rx="34" fill="#fbfdff"/>
  <g class="s">
    <text x="74" y="96" font-size="60" class="h">如果所有聊天记录，现在全部消失呢？</text>
    <text x="74" y="148" font-size="26" class="m">接管测试：不给原聊天、不给口头说明，全新 Agent 只带一个 clone 上岗。</text>

    <!-- 左：被删除的原始会话 -->
    <g opacity="0.55">
      <g filter="url(#sh)"><rect x="70" y="230" width="380" height="420" rx="28" fill="#f4f6fa" stroke="#c3cede" stroke-width="2"/></g>
      <text x="102" y="292" font-size="30" class="tag" fill="#44536b">原始 Agent / 会话</text>
      <rect x="102" y="330" width="316" height="70" rx="14" fill="#ffffff" stroke="#c3cede" stroke-dasharray="8 7"/>
      <text x="126" y="373" font-size="22" fill="#8a97ab">session A · 已删除</text>
      <rect x="102" y="420" width="316" height="70" rx="14" fill="#ffffff" stroke="#c3cede" stroke-dasharray="8 7"/>
      <text x="126" y="463" font-size="22" fill="#8a97ab">session B · 已删除</text>
      <rect x="102" y="510" width="316" height="70" rx="14" fill="#ffffff" stroke="#c3cede" stroke-dasharray="8 7"/>
      <text x="126" y="553" font-size="22" fill="#8a97ab">口头说明 · 无</text>
    </g>
    <g transform="translate(408 262)">
      <circle r="26" fill="none" stroke="#a33b3b" stroke-width="5"/>
      <line x1="-18" y1="-18" x2="18" y2="18" stroke="#a33b3b" stroke-width="5"/>
    </g>
    <text x="260" y="700" font-size="24" class="m" text-anchor="middle">历史上下文：不可用</text>

    <!-- 中：GitHub 仓库 -->
    <g filter="url(#sh)"><rect x="600" y="230" width="380" height="420" rx="28" fill="#0d2b59"/></g>
    <text x="790" y="300" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle" class="s">GitHub 仓库</text>
    <text x="790" y="342" font-size="22" fill="#9db9dd" text-anchor="middle" class="s">唯一持久桥梁</text>
    <g font-size="21" fill="#dce8f7">
      <text x="790" y="404" text-anchor="middle">· 绑定与写权威（origin）</text>
      <text x="790" y="446" text-anchor="middle">· AGENTS.md 规则</text>
      <text x="790" y="488" text-anchor="middle">· Command Center 指针</text>
      <text x="790" y="530" text-anchor="middle">· 当前 Phase 与冻结合同</text>
      <text x="790" y="572" text-anchor="middle">· 方法论 PIN（版本固定）</text>
    </g>
    <path d="M450 440 L 596 440" stroke="#8aa2c0" stroke-width="5" stroke-dasharray="10 9" fill="none"/>
    <text x="790" y="700" font-size="24" class="m" text-anchor="middle">聊天没了，状态还在</text>

    <!-- 右：Fresh Agent 接管 -->
    <g filter="url(#sh)"><rect x="1130" y="230" width="400" height="420" rx="28" fill="#edfbf5" stroke="#9cdec4" stroke-width="2"/></g>
    <text x="1162" y="292" font-size="30" class="tag" fill="#117451">全新 Agent · Fresh Clone</text>
    <g class="s">
      <text x="1162" y="348" class="step">1. clone 仓库</text>
      <text x="1162" y="396" class="step">2. 读绑定与 remotes 登记</text>
      <text x="1162" y="444" class="step">3. 找到 Command Center</text>
      <text x="1162" y="492" class="step">4. 恢复权威 / 规则 / 保护能力</text>
      <text x="1162" y="540" class="step">5. 接上当前 Phase，继续干活</text>
    </g>
    <rect x="1162" y="570" width="250" height="52" rx="14" fill="#0ca56f"/>
    <text x="1287" y="605" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" class="s">TAKEOVER PASS</text>
    <path d="M980 440 L 1126 440" stroke="#0ca56f" stroke-width="6" fill="none" marker-end="url(#ag)"/>
    <text x="1330" y="700" font-size="24" class="m" text-anchor="middle">不依赖任何一次聊天</text>

    <!-- 底部规则句 -->
    <rect x="430" y="780" width="740" height="90" rx="20" fill="#fff8e8" stroke="#ebcb79" stroke-width="2"/>
    <text x="800" y="836" font-size="30" font-weight="800" fill="#8f6104" text-anchor="middle" class="s">换 Agent，不换规则。</text>
  </g>
</svg>
