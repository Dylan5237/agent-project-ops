name: enforcement-contract

on:
  pull_request:
    paths:
      - 'scripts/hooks/**'
      - 'scripts/lib/**'
      - 'scripts/install-hooks.sh'
      - 'scripts/share-export.sh'
      - 'scripts/export-sync.sh'
      - 'tests/hook-behavior.sh'
      - 'tests/url-guard.sh'
      - 'tests/share-export.sh'
      - 'tests/export-sync.sh'
      - '.github/workflows/enforcement-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/hooks/**'
      - 'scripts/lib/**'
      - 'scripts/install-hooks.sh'
      - 'scripts/share-export.sh'
      - 'scripts/export-sync.sh'
      - 'tests/hook-behavior.sh'
      - 'tests/url-guard.sh'
      - 'tests/share-export.sh'
      - 'tests/export-sync.sh'
      - '.github/workflows/enforcement-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          bash -n scripts/hooks/pre-push-authority.sh
          bash -n scripts/lib/url-guard.sh
          bash -n scripts/lib/share-export-denylist.sh
          bash -n scripts/lib/export-strip-list.sh
          bash -n scripts/install-hooks.sh
          bash -n scripts/share-export.sh
          bash -n scripts/export-sync.sh
          bash -n tests/hook-behavior.sh
          bash -n tests/url-guard.sh
          bash -n tests/share-export.sh
          bash -n tests/export-sync.sh
      - name: URL guard matrix
        run: bash tests/url-guard.sh
      - name: Authority/projection behavior matrix
        run: bash tests/hook-behavior.sh
      - name: Share-export denylist contract
        run: bash tests/share-export.sh
      - name: Export remote strip/sync contract
        run: bash tests/export-sync.sh
