name: enforcement-contract

on:
  pull_request:
    paths:
      - 'scripts/hooks/**'
      - 'scripts/lib/**'
      - 'scripts/install-hooks.sh'
      - 'tests/hook-behavior.sh'
      - 'scripts/new-worktree.sh'
      - 'scripts/tidy-worktrees.sh'
      - 'tests/worktree-base.sh'
      - 'tests/worktree-tidy.sh'
      - 'playbooks/git-worktree.md'
      - 'skills/git-worktree-and-branch/SKILL.md'
      - 'tests/url-guard.sh'
      - '.github/workflows/enforcement-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/hooks/**'
      - 'scripts/lib/**'
      - 'scripts/install-hooks.sh'
      - 'tests/hook-behavior.sh'
      - 'scripts/new-worktree.sh'
      - 'scripts/tidy-worktrees.sh'
      - 'tests/worktree-base.sh'
      - 'tests/worktree-tidy.sh'
      - 'playbooks/git-worktree.md'
      - 'skills/git-worktree-and-branch/SKILL.md'
      - 'tests/url-guard.sh'
      - '.github/workflows/enforcement-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          bash -n scripts/hooks/pre-push-authority.sh
          bash -n scripts/lib/url-guard.sh
          bash -n scripts/install-hooks.sh
          bash -n tests/hook-behavior.sh
          bash -n scripts/new-worktree.sh
          bash -n scripts/tidy-worktrees.sh
          bash -n tests/worktree-base.sh
          bash -n tests/worktree-tidy.sh
          bash -n tests/url-guard.sh
      - name: URL guard matrix
        run: bash tests/url-guard.sh
      - name: Worktree base selection contract
        run: bash tests/worktree-base.sh
      - name: Worktree retirement contract
        run: bash tests/worktree-tidy.sh
      - name: Origin-only authority behavior matrix
        run: bash tests/hook-behavior.sh
