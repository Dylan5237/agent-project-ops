name: bootstrap-contract

on:
  pull_request:
    paths:
      - '.gitattributes'
      - 'scripts/bootstrap-project.sh'
      - 'scripts/share-export.sh'
      - 'scripts/lib/share-export-denylist.sh'
      - 'templates/**'
      - 'playbooks/bootstrap-project.md'
      - 'playbooks/adopt-existing-project.md'
      - 'playbooks/start-project.md'
      - 'playbooks/share-export.md'
      - 'skills/bootstrap-project/**'
      - 'skills/repo-reconciliation-cleanup/**'
      - 'scripts/scan-inverted-sot.py'
      - 'tests/bootstrap-local.sh'
      - 'tests/inverted-sot.sh'
      - '.github/workflows/bootstrap-contract.yml'
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - 'scripts/bootstrap-project.sh'
      - 'scripts/share-export.sh'
      - 'scripts/lib/share-export-denylist.sh'
      - 'templates/**'
      - 'playbooks/bootstrap-project.md'
      - 'playbooks/adopt-existing-project.md'
      - 'playbooks/start-project.md'
      - 'playbooks/share-export.md'
      - 'skills/bootstrap-project/**'
      - 'skills/repo-reconciliation-cleanup/**'
      - 'scripts/scan-inverted-sot.py'
      - 'tests/bootstrap-local.sh'
      - 'tests/inverted-sot.sh'
      - '.github/workflows/bootstrap-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          bash -n scripts/bootstrap-project.sh
          bash -n tests/bootstrap-local.sh
          bash -n tests/inverted-sot.sh
          bash -n scripts/share-export.sh
      - name: Inverted-SoT wording contract
        run: bash tests/inverted-sot.sh
      - name: Dry-run contract
        run: |
          bash scripts/bootstrap-project.sh --dry-run \
            --name smoke-project \
            --dir /tmp/smoke-project \
            --disposer @apo-test \
            --no-projection \
            --skip-github \
            --yes
      - name: Local scaffold and fresh-clone contract
        run: bash tests/bootstrap-local.sh
